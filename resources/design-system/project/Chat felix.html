<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Felix — Chat · Rivière basse</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Spectral:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="felix.css" />
<style>
  .app { display: flex; flex-direction: column; height: 100vh; }

  /* Barre du haut */
  .topbar {
    height: 60px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; border-bottom: 1px solid var(--line);
    background: rgba(243,237,225,.82); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 5;
  }
  .tb-left { display: flex; align-items: center; gap: 12px; }
  .tb-right { display: flex; align-items: center; gap: 14px; }
  .felix-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: var(--gold); color: #fdfaf2; }
  .felix-word { font-family: var(--serif); font-weight: 600; font-size: 19px; margin-left: 1px; letter-spacing: .01em; }
  .tb-sep { width: 4px; height: 4px; border-radius: 50%; background: var(--line-2); }
  .tb-project { font-family: var(--sans); font-weight: 600; font-size: 14px; color: var(--ink-2); }
  .tb-save { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-3); }
  .save-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sage); box-shadow: 0 0 0 3px var(--sage-soft); }

  /* Fil */
  .thread-wrap { flex: 1; overflow-y: auto; }
  .thread { max-width: 768px; margin: 0 auto; padding: 26px 24px 14px; }
  .daymark { display: flex; align-items: center; gap: 14px; margin: 2px 2px 26px; }
  .daymark::before, .daymark::after { content: ""; height: 1px; flex: 1; background: var(--line); }
  .daymark span { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }

  .msg { display: flex; gap: 13px; margin-bottom: 22px; animation: rise .34s cubic-bezier(.2,.7,.3,1) both; }
  .msg-user { justify-content: flex-end; }
  .msg-av { flex: none; margin-top: 1px; }
  .msg-main { min-width: 0; flex: 1; }
  @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

  .felix-text { font-family: var(--serif); font-size: 17px; line-height: 1.68; color: var(--ink); margin: 4px 0; max-width: 62ch; text-wrap: pretty; }
  .felix-text .work { font-style: italic; color: var(--gold-deep); }

  .bubble {
    font-family: var(--serif); font-size: 16.5px; line-height: 1.6; color: var(--ink);
    background: #fffdf8; border: 1px solid var(--line-2); border-radius: 15px 15px 5px 15px;
    padding: 11px 16px; max-width: 74%; box-shadow: var(--shadow-sm); text-wrap: pretty;
  }

  .typing { display: inline-flex; gap: 5px; padding: 13px 2px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: bob 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%,80%,100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }

  /* Tool use */
  .tool-card { max-width: 560px; border: 1px solid var(--gold-line); background: #fbf6ea; border-radius: var(--r-md); overflow: hidden; box-shadow: var(--shadow-sm); margin: 3px 0; }
  .tool-head { display: flex; align-items: center; gap: 9px; padding: 8px 12px; background: var(--gold-soft); border-bottom: 1px solid var(--gold-line); }
  .tool-ic { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--gold); color: #fdfaf2; }
  .tool-label { font-family: var(--mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--gold-deep); }
  .tool-spacer { flex: 1; }
  .tool-link { display: inline-flex; align-items: center; gap: 5px; font-family: var(--sans); font-size: 12.5px; font-weight: 600; color: var(--gold-deep); text-decoration: none; }
  .tool-link:hover { text-decoration: underline; }
  .tool-body { padding: 12px 14px; }
  .tool-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .tool-subj { font-family: var(--sans); font-weight: 700; font-size: 14px; color: var(--ink); }
  .tool-fdot { width: 3px; height: 3px; border-radius: 50%; background: var(--line-2); }
  .tool-field { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  .tool-added { display: flex; gap: 10px; padding: 9px 11px; background: #fff; border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 6px; }
  .tool-plus { font-family: var(--mono); font-size: 11px; color: var(--sage); flex: none; margin-top: 2px; }
  .tool-text { font-family: var(--serif); font-size: 15px; line-height: 1.5; color: var(--ink); }

  /* Choix multiple */
  .choice-card { max-width: 580px; border: 1px solid var(--line-2); background: var(--card); border-radius: var(--r-md); padding: 16px; box-shadow: var(--shadow-sm); }
  .choice-q { font-family: var(--serif); font-size: 16.5px; font-weight: 500; line-height: 1.5; color: var(--ink); margin-bottom: 13px; text-wrap: pretty; }
  .choice-opts { display: flex; flex-direction: column; gap: 8px; }
  .choice-opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 11px 13px; border: 1px solid var(--line-2); background: #fffdf8; border-radius: 8px; transition: border-color .14s ease, background .14s ease, transform .14s ease, opacity .14s ease; }
  .choice-opt:hover:not(:disabled) { border-color: var(--gold); background: var(--gold-soft); transform: translateX(2px); }
  .opt-k { flex: none; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-family: var(--mono); font-weight: 600; font-size: 13px; background: var(--card-2); border: 1px solid var(--line-2); color: var(--ink-2); }
  .choice-opt:hover:not(:disabled) .opt-k { background: var(--gold); color: #fff; border-color: var(--gold); }
  .opt-main { display: flex; flex-direction: column; gap: 2px; }
  .opt-label { font-family: var(--sans); font-weight: 600; font-size: 14px; color: var(--ink); }
  .opt-desc { font-family: var(--serif); font-size: 14px; line-height: 1.45; color: var(--ink-2); text-wrap: pretty; }
  .choice-opt.chosen { border-color: var(--sage); background: var(--sage-soft); }
  .choice-opt.chosen .opt-k { background: var(--sage); color: #fff; border-color: var(--sage); }
  .choice-opt.dim { opacity: .42; }
  .choice-opt:disabled { cursor: default; }
  .choice-free { margin-top: 14px; padding-top: 13px; border-top: 1px dashed var(--line-2); }
  .free-or { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 8px; }
  .free-row { display: flex; gap: 8px; }
  .free-input { flex: 1; font-family: var(--sans); font-size: 14px; padding: 9px 12px; border: 1px solid var(--line-2); border-radius: 7px; background: #fffdf8; color: var(--ink); }
  .free-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
  .free-input::placeholder { color: var(--ink-3); }
  .free-send { flex: none; width: 38px; display: grid; place-items: center; border: none; border-radius: 7px; background: var(--gold); color: #fff; transition: background .15s ease; }
  .free-send:hover:not(:disabled) { background: var(--gold-deep); }
  .free-send:disabled { background: var(--line-2); color: var(--ink-3); cursor: default; }

  /* Citation */
  .cite-card { max-width: 580px; }
  .cite-quote { margin: 0; padding: 0 0 0 20px; border-left: 3px solid var(--gold-line); font-family: var(--serif); font-style: italic; font-size: 17px; line-height: 1.62; color: var(--ink); text-wrap: pretty; }
  .cite-mark { display: block; color: var(--gold-line); margin: 0 0 0 16px; }
  .cite-source { font-family: var(--mono); font-size: 11.5px; letter-spacing: .03em; color: var(--ink-3); margin: 11px 0 0 20px; }
  .cite-note { font-family: var(--serif); font-size: 15px; line-height: 1.55; color: var(--ink-2); margin: 13px 0 0; max-width: 60ch; text-wrap: pretty; }

  /* Alerte incohérence */
  .alert-card { max-width: 580px; border: 1px solid var(--terra-line); background: var(--terra-soft); border-radius: var(--r-md); padding: 14px 15px; box-shadow: var(--shadow-sm); }
  .alert-head { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
  .alert-ic { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; background: var(--terra); color: #fff; flex: none; }
  .alert-ic.ok { background: var(--sage); }
  .alert-title { font-family: var(--sans); font-weight: 700; font-size: 14px; color: var(--terra); }
  .alert-body { font-family: var(--serif); font-size: 15.5px; line-height: 1.55; color: var(--ink); margin: 0; text-wrap: pretty; }
  .alert-actions { display: flex; gap: 8px; margin-top: 12px; }
  .alert-btn { border-color: var(--terra-line) !important; background: #fff !important; color: var(--terra) !important; }
  .alert-btn:hover { border-color: var(--terra) !important; background: var(--terra-soft) !important; }
  .alert-resolves { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .resolve-opt { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 10px 12px; border: 1px solid var(--terra-line); background: #fff; border-radius: 8px; transition: border-color .14s ease, background .14s ease; }
  .resolve-opt:hover { border-color: var(--terra); background: var(--terra-soft); }
  .ro-label { font-family: var(--sans); font-weight: 600; font-size: 14px; color: var(--ink); }
  .ro-desc { font-family: var(--serif); font-size: 14px; line-height: 1.4; color: var(--ink-2); }
  .alert-card.resolved { border-color: var(--sage-line); background: var(--sage-soft); }
  .alert-card.resolved .alert-title { color: var(--sage); }
  .alert-dismissed { display: flex; align-items: center; gap: 7px; font-family: var(--sans); font-size: 13px; color: var(--ink-3); }
  .redo { background: none; border: none; color: var(--gold-deep); font-weight: 600; font-size: 13px; text-decoration: underline; padding: 0; cursor: pointer; }

  /* Composer */
  .composer-wrap { flex: none; border-top: 1px solid var(--line); background: rgba(243,237,225,.9); backdrop-filter: blur(10px); padding: 14px 24px 16px; }
  .composer-col { max-width: 768px; margin: 0 auto; }
  .composer { display: flex; align-items: flex-end; gap: 10px; background: #fffdf8; border: 1px solid var(--line-2); border-radius: 14px; padding: 8px 8px 8px 16px; box-shadow: var(--shadow-md); transition: border-color .15s ease, box-shadow .15s ease; }
  .composer:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft), var(--shadow-md); }
  .composer-ta { flex: 1; border: none; background: none; resize: none; font-family: var(--serif); font-size: 16px; line-height: 1.5; color: var(--ink); padding: 6px 0; max-height: 180px; }
  .composer-ta:focus { outline: none; }
  .composer-ta::placeholder { color: var(--ink-3); }
  .composer-send { flex: none; width: 40px; height: 40px; border: none; border-radius: 10px; background: var(--gold); color: #fff; display: grid; place-items: center; transition: background .15s ease, transform .06s ease; }
  .composer-send:hover:not(:disabled) { background: var(--gold-deep); }
  .composer-send:active { transform: translateY(1px); }
  .composer-send:disabled { background: var(--line-2); color: var(--ink-3); cursor: default; }
  .composer-hint { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-align: center; margin-top: 9px; }

  @media (prefers-reduced-motion: reduce) { .msg { animation: none; } .typing span { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="felix-ui.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="chat-app.jsx"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById("root")).render(
    React.createElement(window.ChatApp)
  );
</script>
</body>
</html>
